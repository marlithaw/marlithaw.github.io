<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3AP Modern Studio</title>
<style>
html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, system-ui, sans-serif;
  background: #092d3a;
  color: #ffffff;
}
body {
  display: grid;
  place-items: center;
}
.boot {
  display: grid;
  gap: 16px;
  width: min(420px, calc(100% - 48px));
  text-align: center;
}
.boot strong {
  font-size: 1.2rem;
  letter-spacing: -0.03em;
}
.boot span {
  color: rgba(255,255,255,0.72);
}
.bar {
  overflow: hidden;
  height: 8px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
}
.bar::after {
  content: "";
  display: block;
  width: 42%;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #ff6b00, #ff9800);
  animation: load 1.1s ease-in-out infinite alternate;
}
@keyframes load {
  from { transform: translateX(-8%); }
  to { transform: translateX(146%); }
}
</style>
</head>
<body>
<div class="boot">
  <strong>Loading R3AP Modern Studio</strong>
  <span>Preparing the shared build...</span>
  <div class="bar"></div>
</div>
<script>
(async function () {
  const parts = [
    "payload-01.txt",
    "payload-02.txt",
    "payload-03.txt",
    "payload-04.txt"
  ];

  const base64 = (await Promise.all(parts.map((part) => fetch(part).then((response) => response.text())))).join("").replace(/\s+/g, "");
  const binary = atob(base64);
  const bytes = Uint8Array.from(binary, (char) => char.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const html = await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
}()).catch((error) => {
  document.body.innerHTML = '<div class="boot"><strong>Load failed</strong><span>Please refresh the page. If it keeps failing, the share folder may be incomplete.</span></div>';
  console.error(error);
});
</script>
</body>
</html>
